<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Expert Dashboard | Signifi</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/kspatel45/VisionAssist/main/Vision%20Assist%20logo.png">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --signifi-navy: #0D202D; --accent-cyan: #72E0FB; }
        body { background: var(--signifi-navy); color: white; font-family: sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        #home-screen-ui { display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 90vh; width: 100%; padding: 40px 0; }
        .logo-box { background: white; padding: 15px 30px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
        .va-logo { width: 300px; } .signifi-logo { width: 180px; }
        .btn-answer { background: #28a745; color: white; padding: 20px 60px; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; font-size: 1.5rem; margin-top: 20px; }
        #video-stage { display: none; position: relative; width: 100vw; height: 100vh; background: #000; }
        #remote-video { width: 100%; height: 100%; object-fit: cover; }
        #local-video { position: absolute; top: 20px; right: 20px; width: 280px; height: 180px; border: 2px solid var(--accent-cyan); border-radius: 10px; transform: scaleX(-1); z-index: 20; background: #222; }
        .controls { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 30; }
        .btn-ui { padding: 12px 24px; border-radius: 10px; border: none; background: rgba(255,255,255,0.2); color: white; cursor: pointer; font-weight: bold; }
        .admin-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
        .admin-content { background: white; padding: 25px; border-radius: 10px; width: 350px; color: #333; }
    </style>
</head>
<body>
    <audio id="ring" loop src="https://assets.mixkit.co/active_storage/sfx/1359/1359-preview.mp3"></audio>
    <div id="home-screen-ui">
        <div class="logo-box"><img src="https://raw.githubusercontent.com/kspatel45/VisionAssist/main/Vision%20Assist%20logo.png" class="va-logo"></div>
        <div id="status-card" style="text-align: center;">
            <h2 id="state">Offline: Set Code in Admin</h2>
            <button id="init-btn" onclick="activate()" style="display:none; padding:15px 30px; margin-top:10px; cursor:pointer;">ACTIVATE STATION</button>
            <div id="incoming-call-ui" style="display:none;">
                <h2 style="color: #28a745;">INCOMING CALL...</h2>
                <button class="btn-answer" onclick="acceptCall()">ANSWER</button>
            </div>
        </div>
        <div class="logo-box"><img src="https://raw.githubusercontent.com/kspatel45/VisionAssist/main/signifi-logo.png" class="signifi-logo"></div>
    </div>

    <div id="video-stage">
        <video id="remote-video" autoplay playsinline></video>
        <video id="local-video" autoplay muted playsinline></video>
        <div class="controls">
            <button class="btn-ui" onclick="toggleMute()">Mute</button>
            <button class="btn-ui" onclick="toggleVideo()">Video Off</button>
            <button class="btn-ui" style="background:#ff4444;" onclick="hangUp()">Hang Up</button>
        </div>
    </div>

    <div id="admin-lock" onclick="openAdmin()" style="position:fixed; top:0; right:0; width:60px; height:60px; cursor:pointer; z-index:999;"></div>
    <div id="admin-panel" class="admin-modal">
        <div class="admin-content">
            <h3>Expert Admin</h3>
            <input type="text" id="my-code-input" placeholder="Enter Station Code" style="width:100%; padding:8px; margin:10px 0;">
            <button onclick="saveAdmin()" style="width:100%; background:green; color:white; padding:10px; cursor:pointer;">Save & Start</button>
        </div>
    </div>

    <script>
        let peer, localStream, activeCall;
        const ring = document.getElementById('ring');

        const savedCode = localStorage.getItem('tech-code');
        if(savedCode) startStation(savedCode);

        function activate() { 
            document.getElementById('init-btn').style.display='none'; 
            document.getElementById('state').innerText="Station Online: " + localStorage.getItem('tech-code');
        }

        function openAdmin() { if(prompt("Pass:")==="123") document.getElementById('admin-panel').style.display='flex'; }
        function saveAdmin() { localStorage.setItem('tech-code', document.getElementById('my-code-input').value); location.reload(); }

        function startStation(code) {
            peer = new Peer('Expert-' + code);
            document.getElementById('state').innerText = "Expert Station Ready";
            document.getElementById('init-btn').style.display = 'inline-block';
            
            peer.on('call', call => {
                activeCall = call;
                ring.play().catch(()=>{});
                document.getElementById('incoming-call-ui').style.display = 'block';
                
                activeCall.on('stream', remoteStream => {
                    document.getElementById('remote-video').srcObject = remoteStream;
                });
                activeCall.on('close', () => location.reload());
            });
        }

        async function acceptCall() {
            ring.pause();
            try {
                // 1. Start Camera FIRST
                localStream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
                document.getElementById('local-video').srcObject = localStream;
                
                // 2. Answer with the ready stream
                activeCall.answer(localStream);
                
                document.getElementById('home-screen-ui').style.display = 'none';
                document.getElementById('video-stage').style.display = 'block';
            } catch (e) { alert("Camera Error"); }
        }

        function toggleMute() { localStream.getAudioTracks()[0].enabled = !localStream.getAudioTracks()[0].enabled; }
        function toggleVideo() { localStream.getVideoTracks()[0].enabled = !localStream.getVideoTracks()[0].enabled; }
        function hangUp() { if(activeCall) activeCall.close(); location.reload(); }
    </script>
</body>
</html>
